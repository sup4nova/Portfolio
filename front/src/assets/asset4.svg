    <ellipse cx="600" cy="315" rx="320" ry="170" stroke-width="1.5" stroke-dasharray="2 16" transform="rotate(14 600 315)"></ellipse>
  </g>

  
  <g>
    
    <g opacity="0.6">
      <circle cx="300" cy="180" r="22" fill="none" stroke="#0f6444" stroke-width="2"></circle>
