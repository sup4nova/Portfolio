    <circle cx="980" cy="250" r="3.5" fill="#0f6444" opacity="0.45"></circle>
    <circle cx="210" cy="300" r="3.5" fill="#0f6444" opacity="0.45"></circle>
  </g>

  
  <circle cx="600" cy="315" r="140" fill="url(#rnd-glow)"></circle>
  <g transform="translate(600 315)">
    <path d="M 0,-66 Q 11,-11 66,0 Q 11,11 0,66 Q -11,11 -66,0 Q -11,-11 0,-66 Z" fill="url(#rnd-star)"></path>
    <ellipse cx="-16" cy="-22" rx="14" ry="9" fill="#ffffff" opacity="0.20" transform="rotate(-30 -16 -22)"></ellipse>
