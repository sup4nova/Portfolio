    </g>
    <g opacity="0.45">
      <circle cx="905" cy="450" r="17" fill="none" stroke="#0f6444" stroke-width="2"></circle>
      <circle cx="905" cy="450" r="4" fill="#0f6444"></circle>
    </g>
    
    <path d="M 880,165 Q 882,153 894,151 Q 882,149 880,137 Q 878,149 866,151 Q 878,153 880,165 Z" fill="#0f6444" opacity="0.55"></path>
