      <rect x="22" y="58" width="124" height="6" rx="3"></rect>
      <rect x="22" y="72" width="124" height="6" rx="3"></rect>
      <rect x="22" y="86" width="96" height="6" rx="3"></rect>
      <rect x="22" y="112" width="124" height="6" rx="3"></rect>
      <rect x="22" y="126" width="124" height="6" rx="3"></rect>
      <rect x="22" y="140" width="70" height="6" rx="3"></rect>
    </g>
    
    <circle cx="132" cy="40" r="13" fill="#00bb81"></circle>
  </g>

  
  <g transform="translate(470 408)">
    <path d="M 0,-14 L 4,-4 L 14,0 L 4,4 L 0,14 L -4,4 L -14,0 L -4,-4 Z" fill="#cbff48"></path>
  </g>

  <rect width="800" height="600" filter="url(#job-grain)" opacity="0.05"></rect>
</svg>