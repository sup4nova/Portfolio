      <rect x="44" y="0" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="88" y="0" width="38" height="38" rx="5" fill="#0e3340"></rect>
      <rect x="132" y="0" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="0" y="44" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="44" y="44" width="38" height="38" rx="5" fill="#0e3340"></rect>
      <rect x="88" y="44" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="132" y="44" width="38" height="38" rx="5" fill="#0e3340"></rect>
      <rect x="0" y="88" width="38" height="38" rx="5" fill="#0e3340"></rect>
      <rect x="44" y="88" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="88" y="88" width="38" height="38" rx="5" fill="#0e3340"></rect>
      <rect x="132" y="88" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="0" y="132" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="44" y="132" width="38" height="38" rx="5" fill="#0e3340"></rect>
      <rect x="88" y="132" width="38" height="38" rx="5" fill="#13414f"></rect>
      <rect x="132" y="132" width="38" height="38" rx="5" fill="#0e3340"></rect>
    </g>
  </g>

  
  <g transform="translate(400 300)">
