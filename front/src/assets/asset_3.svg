    <circle r="62" fill="none" stroke="#cbff48" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"></circle>
    <circle r="44" fill="#0a2632" stroke="#5ee9c8" stroke-width="2"></circle>
    
    <circle cy="-6" r="14" fill="none" stroke="url(#cry-key)" stroke-width="6"></circle>
    <rect x="-5" y="2" width="10" height="20" rx="3" fill="url(#cry-key)"></rect>
    
    <circle cx="0" cy="-62" r="4" fill="#cbff48"></circle>
    <circle cx="44" cy="44" r="3.5" fill="#5ee9c8"></circle>
    <circle cx="-44" cy="44" r="3.5" fill="#00bb81"></circle>
