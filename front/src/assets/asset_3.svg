    <text x="88" y="176" opacity="0.85">31</text>
    <text x="132" y="176" opacity="0.6" fill="#cbff48">AF</text>
  </g>

  
  <g stroke="#cbff48" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 462 300 C 500 300 500 250 530 250"></path>
